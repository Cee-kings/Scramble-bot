# fly.toml app configuration file generated for scramble-bot on 2026-07-21T12:16:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scramble-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
